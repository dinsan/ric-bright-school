services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina
      POSTGRES_DB: lumina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      LUMINA_ENVIRONMENT: local
      LUMINA_DATABASE_URL: postgresql+asyncpg://lumina:lumina@db:5432/lumina
      LUMINA_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, then serve. (Run migrations as a separate job once you have >1 replica.)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle, so it must be reachable from the user's machine.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      # Server-side rendering talks to the API over the internal Docker network.
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
