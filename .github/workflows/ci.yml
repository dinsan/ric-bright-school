# Continuous integration: lint, tests on PostgreSQL, Docker image + Compose stack.
#
# Branch protection requires only the final "CI passed" job (see .github/rulesets/ and
# `make protect-branch`). It fails unless every other job succeeded, so jobs can be added
# here without touching the GitHub settings.
#
# No `paths` filters on purpose: a required check that never runs blocks the pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per pull request (or branch); a new push cancels the outdated run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install
        run: make install

      - name: ruff, ruff format --check, mypy --strict
        run: make lint
        env:
          RUFF_OUTPUT_FORMAT: github  # inline annotations on the pull request diff

  test:
    name: Tests (Python ${{ matrix.python-version }}, PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version and the version in the Docker image.
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina
          POSTGRES_DB: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # When set, `make test` uses this database instead of starting the Compose test-db.
      LUMINA_TEST_DATABASE_URL: postgresql+asyncpg://lumina:lumina@localhost:5432/lumina_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install
        run: make install

      - name: Run tests against PostgreSQL
        run: make test

  docker:
    name: Docker image and Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway admin for the temporary CI stack; it protects nothing, so not a secret.
      LUMINA_SMOKE_EMAIL: ci-admin@example.com
      LUMINA_SMOKE_PASSWORD: throwaway-smoke-passphrase
    steps:
      - uses: actions/checkout@v5

      - name: Build the image and start db, migrate and api (same command as the README)
        run: docker compose up --build --detach

      - name: Wait until the API is ready
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ready; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready within 120 seconds" >&2
          exit 1

      - name: Check the migrations ran as a separate, successful job
        run: |
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet migrate)")
          echo "migrate exit code: $exit_code"
          test "$exit_code" = "0"

      - name: Seed demo data (README step) and check it is idempotent
        run: |
          docker compose exec -T api python -m app.scripts.seed
          docker compose exec -T api python -m app.scripts.seed | grep "0 new course"

      - name: Create a platform admin (the command an operator runs)
        run: |
          docker compose exec -T -e LUMINA_ADMIN_PASSWORD="$LUMINA_SMOKE_PASSWORD" api \
            python -m app.scripts.create_admin --email "$LUMINA_SMOKE_EMAIL"

      - name: Smoke test the running stack (public, sign in, write, upload, sign out)
        run: scripts/smoke-test.sh http://localhost:8000

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  ci-passed:
    # The single required status check. Keep this name in sync with .github/rulesets/.
    name: CI passed
    if: always()
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed ($result)." >&2
              exit 1
            fi
          done
